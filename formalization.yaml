version: v0.4
project:
  name: Continuous binary implementation congruence and sharp finite welfare frontier
  description: 'A general two-alternative implementation characterization on own-type domains containing
    an open ball: affine private and social valuation differences, nonzero social linear form, one active
    welfare cut, and a fixed independent opposing probability law force nonnegative coefficient alignment.
    Arbitrary measurable efficient lotteries have integrable Bayesian incentive compatible transfers exactly
    under alignment, with explicit ex-post truthful-opponent transfers and a measurable efficient allocation
    witness. Arbitrary distributions including atoms are covered. A genuine independent uniform-square
    auction model rules out efficiency even under only agent 0 incentive compatibility for every a,b>0.
    The separately proved finite sharp welfare/error frontier and original example corollary are retained.
    This does not formalize arbitrary-alternative Theorem 4.3 or genericity, and makes no novelty claim.'
  authors:
  - Arthur Freitas Ramos
  - David Barros Hulak
  - Ruy Jose Guerra Barretto de Queiroz
  responsible_maintainers:
  - Arthur Freitas Ramos
  - David Barros Hulak
  - Ruy Jose Guerra Barretto de Queiroz
  license: BSD-3-Clause
repository:
  role: substantive-development
classification:
  arxiv:
