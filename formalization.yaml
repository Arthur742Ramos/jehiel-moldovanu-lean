sources:
- title: Efficient Design with Interdependent Valuations
  authors:
  - Philippe Jehiel
  - Benny Moldovanu
  type: paper
  year: 2001
  url: https://doi.org/10.1111/1468-0262.00240
  relationship: adapts
  note: The accessible author-hosted February 20, 2000 draft, Section 2, Theorem 4.3 and appendix supply
    the continuous congruence background; full final-journal wording was not verified. This development
    formalizes a binary subtheorem with explicit open-ball and active-support assumptions using weak monotonicity,
    without derivative regularity assumptions. It adds an explicit integrable-transfer converse and a
    genuine continuous uniform-square auction corollary. The prior finite extension of Example 4.2 remains
    separate. No full arbitrary-alternative, generic measure-zero, priority or original-author endorsement
    claim is made.
  author_endorsement: not-contacted
automation:
  methods:
  - method: AI-assisted Lean proof development
    system: OpenAI Codex
    role: Model and proof development, source inspection, local compilation, contract and axiom audits,
      package preparation.
  - method: Independent AI mathematical and source review
    system: OpenAI Codex, separate reviewer agents
    role: Fresh separate-agent mathematical review of the full continuous necessity, explicit-transfer
      converse and actual-prior corollary; exact-source and prose-to-binder review; separately retained
      symbolic/rational verification of the finite frontier.
  - method: Lean tactic automation
