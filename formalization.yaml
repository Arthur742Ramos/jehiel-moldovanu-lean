review:
  status: Local proof development with separate AI mathematical and exact-source/prose-to-binder reviews.
    Final local mechanical and pinned renderer evidence is supplied in the accompanying bundle. No hosted
    exact-SHA verification, editorial acceptance, submission, registration, novelty or independent human
    review is asserted.
  human_review: No independent human proof review or original-author endorsement is claimed.
  limitations: The continuous theorem has exactly two alternatives and a distinguished agent whose types/reports
    lie in a set containing an open ball in a real normed vector space. Opposing beliefs use a single
    fixed probability measure independent of own true type. Private/social differences are affine with
    a nonzero social linear form. Active support at one interior threshold is explicit; no density or
    atomlessness is required. Lotteries are measurable per report and bounded in [0,1]. Baseline private
    values, opponent private terms and all received transfers are integrable; the social shock is measurable,
    and constructive existence additionally needs it integrable. Incentive inequalities quantify all true/report
    pairs. Efficiency is pointwise on all actual opponent states, with arbitrary efficient tie randomization.
    Transfers establish ex-post IC only with truthful opponents, not dominant-strategy IC. No budget,
    participation or individual-rationality constraints are imposed. The continuous auction uses actual
    subtype uniform-square volume and independent product priors and proves impossibility even for only
    agent 0 BIC. The old finite sharp frontier retains its separate 0<a<b, binary-type, uniform-prior
    hypotheses and budget-balanced constructive witnesses.
alignment:
  statements:
  - lean: JM.Binary.utility_integrable
    description: For every admissible true/report pair, the actual utility integrand is integrable under
      a probability law when private baseline and opponent terms and report transfers are integrable and
      q is a measurable bounded lottery. No totalized undefined utility is used.
  - lean: JM.Binary.congruence
    description: For every real normed E, measurable opponent space and probability law, every own domain
      U containing a positive-radius ball around t0, nonzero linear social coefficient A, linear private
      coefficient c, measurable social shock H, integrable private baseline and opponent term, measurable
      lottery, integrable transfers, all-type BIC, pointwise efficiency and positive mass in every band
      around the active cut imply existence of lambda>=0 with c(v)=lambda*A(v) for all v. No own prior,
      finite dimensionality, atomlessness or transfer differentiability is required.
  - lean: JM.Binary.aligned_ex_post
    description: For any efficient bounded lottery and coefficient relation c=lambda*A with lambda>=0,
      received transfers (lambda*H-d)*q establish pointwise own-report incentive compatibility with opponents
      held at their actual types. This is not dominant-strategy truthfulness under false opponent reports.
  - lean: JM.Binary.implementation_iff
    description: For every specified measurable efficient lottery under the open-ball, nonzero-social-coefficient,
      active-cut, measurable-social-shock and integrable private/social term hypotheses, integrable BIC
      transfers exist iff c is a nonnegative multiple of A. Transfer construction covers arbitrary efficient
      ties and all opposing probability distributions.
  - lean: JM.Binary.efficient_bic_exists_iff
    description: Under those hypotheses and measurable H, an actual measurable efficient lottery and integrable
      BIC transfers exist iff coefficient alignment holds. A threshold allocation supplies the efficient
      witness; allocation existence is not assumed vacuously.
  - lean: JM.ContinuousAuction.uniform_probability
    description: The natural Lebesgue volume on the actual open unit-square signal subtype has mass one.
      jointPrior is its product with itself, expressing independent identical actual agent priors.
  - lean: JM.ContinuousAuction.welfare_difference
    description: For actual binary-auction values, summed true welfare difference equals the derived own
      social linear form plus the opponent shock.
  - lean: JM.ContinuousAuction.utility_integrable
    description: For all true/report square signals, the actual auction utility integrand is integrable
      for measurable bounded lotteries and integrable received transfers when b>=0.
  - lean: JM.ContinuousAuction.impossibility
    description: For every a>0,b>0 and every measurable bounded lottery and integrable received transfers
      on actual open-square signal pairs, pointwise summed-welfare efficiency and all-type agent 0 interim
      incentive compatibility under the genuine uniform-square opponent law imply False. No a<b, budget
      balance or participation constraint is assumed. This is a changed continuous domain, not a weakened
      finite theorem.
  - lean: JM.Sharp.welfare_incentive_frontier
    description: For all real a,b with 0<a and a<b, all profile-indexed probabilities q and transfers
      p, and all real epsilon, IsLottery q and ApproxBIC a b q p epsilon imply a*(b-a)/8 <= (b-a)*epsilon+2*a*loss
      a b q. No budget balance, participation or prior variables are assumed; utility and loss fix independent
      uniform binary types.
  - lean: JM.Sharp.frontier_attained
    description: For every a,b with 0<a<b and theta in [0,1], there exist a lottery and ex-post budget-balanced
      transfers with incentive error a*(1-theta)/8, exact loss (b-a)*theta/16 and equality in the bound.
  - lean: JM.Sharp.feasible_iff
    description: For all real a,b,epsilon,D with 0<a<b, epsilon>=0 and D>=0, Feasible a b epsilon D is
      equivalent to the frontier inequality. Feasible existentially requires a valid lottery, ex-post
      budget balance, epsilon-BIC, and expected loss at most D.
  - lean: JM.Quantitative.welfare_incentive_bound
    description: Arbitrary finite T,O,K and real payoff/welfare tables, normalized weights alpha,nu, nonnegative
      nu, valid q, nonnegative balanced deviation flow ell, epsilon-BIC and a coefficient bound at every
      r,o,k imply A <= beta*welfareLoss+flowMass(ell)*epsilon. The algebra does not require alpha nonnegative
      or beta nonnegative; interpreting alpha as an own prior adds nonnegativity. Opponent weights are
      independent of the true own type. This theorem does not supply certificates or formalize the continuous
      generic result.
  - lean: JM.jehiel_moldovanu_impossibility
    description: The unchanged fixed deterministic contract quantifies x,p and says IsEfficient x -> IsBIC
      uniformPrior x p -> IsBudgetBalanced p -> False. It is now deduced from the a=1,b=2 randomized frontier
      by embedding deterministic allocations, equating utilities and proving zero loss.
