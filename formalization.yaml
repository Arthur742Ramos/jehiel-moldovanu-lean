version: "v0.4"
project:
  name: "jehiel-moldovanu-lean"
  description: >-
    Lean 4 formalization of a finite instance of the Jehiel-Moldovanu
    impossibility theorem (Econometrica 2001): with multidimensional types
    and interdependent valuations, ex post efficiency, Bayesian incentive
    compatibility, and budget balance are jointly unattainable. Two agents
    (Agent := Fin 2) have two-dimensional binary types (T i := Bool x Bool);
    one object is allocated (winner in X := Fin 2). Agent i's winning value
    is valA of its own first signal (0 or 1) plus valB of the other agent's
    second signal (0 or 2), scaled by c = 1; the nonwinner's value is zero.
    Priors are independent and uniform (uniformPrior). Efficiency is
    pointwise: IsEfficient x says the allocation maximizes utilitarian
    welfare at every profile. BIC is interim: IsBIC pi x p says truthful
    reporting maximizes each agent's interim expected utility at every own
    type. Budget balance is pointwise: IsBudgetBalanced p says transfers sum
    to zero at every report profile. The proof is a four-type cycle
    congruence argument: transfer terms telescope around each agent's closed
    four-type cycle, BIC forces each agent's cycle sum to be nonnegative,
    and for every efficient rule the two agents' value-only cycle sums total
    -1/2 (twelve forced winners off the diagonal; a sixteen-way split over
    the four diagonal efficiency ties), which is contradictory. Budget
    balance is a hypothesis of the statement but is not needed for the
    contradiction, since the telescoping is per-agent. This is a finite
    instance, not the continuous generic impossibility theorem of the
    original paper.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  license: "BSD-3-Clause"
