review:
  status: >-
    Local proof development with separate AI mathematical and primary-source
    reviews. Exact symbolic and rational checks independently verify the
    coefficient certificate and all thirty-two incentive inequalities.
    Local mechanical gates and renderer checks are recorded in the evidence
    bundle. No hosted exact-SHA verification, Palomar acceptance, submission,
    mathematical novelty, or independent human review is asserted.
  human_review: "No independent human proof review or original-author endorsement is claimed."
  limitations: >-
    The sharp characterization fixes two agents, one object, binary
    two-dimensional types, independent uniform priors, and winning value
    a*own_first_bit+b*other_second_bit, with 0<a<b. Transfers are received,
    unrestricted real payments. Participation constraints are absent.
    Welfare loss is expected under the true uniform distribution. Incentive
    error is a uniform interim bound at every true type/report pair.
    Budget balance is required for constructive feasibility and is proved
    ex post; the universal lower bound needs no budget restriction. The
    reusable general finite theorem proves soundness of a supplied pointwise
    coefficient bound, not completeness or generic impossibility.
alignment:
  statements:
    - lean: "JM.Sharp.welfare_incentive_frontier"
      description: >-
        For all real a,b with 0<a and a<b, all profile-indexed probabilities
        q and transfers p, and all real epsilon, IsLottery q and
        ApproxBIC a b q p epsilon imply
        a*(b-a)/8 <= (b-a)*epsilon+2*a*loss a b q.
        No budget balance, participation or prior variables are assumed;
        utility and loss fix independent uniform binary types.
    - lean: "JM.Sharp.frontier_attained"
      description: >-
        For every a,b with 0<a<b and theta in [0,1], there exist a lottery
        and ex-post budget-balanced transfers with incentive error
        a*(1-theta)/8, exact loss (b-a)*theta/16 and equality in the bound.
    - lean: "JM.Sharp.feasible_iff"
      description: >-
        For all real a,b,epsilon,D with 0<a<b, epsilon>=0 and D>=0,
        Feasible a b epsilon D is equivalent to the frontier inequality.
        Feasible existentially requires a valid lottery, ex-post budget
        balance, epsilon-BIC, and expected loss at most D.
    - lean: "JM.Quantitative.welfare_incentive_bound"
      description: >-
        Arbitrary finite T,O,K and real payoff/welfare tables, normalized
        weights alpha,nu, nonnegative nu, valid q, nonnegative balanced
        deviation flow ell, epsilon-BIC and a coefficient bound at every
        r,o,k imply A <= beta*welfareLoss+flowMass(ell)*epsilon. The algebra
        does not require alpha nonnegative or beta nonnegative; interpreting
        alpha as an own prior adds nonnegativity. Opponent weights are
        independent of the true own type. This theorem does not supply
        certificates or formalize the continuous generic result.
    - lean: "JM.jehiel_moldovanu_impossibility"
      description: >-
        The unchanged fixed deterministic contract quantifies x,p and says
        IsEfficient x -> IsBIC uniformPrior x p -> IsBudgetBalanced p -> False.
        It is now deduced from the a=1,b=2 randomized frontier by embedding
        deterministic allocations, equating utilities and proving zero loss.
