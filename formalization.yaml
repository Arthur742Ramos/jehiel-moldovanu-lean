version: "v0.4"
project:
  name: "Sharp finite welfare-incentive frontier with interdependent values"
  description: >-
    A sharp parametric finite extension of the Jehiel-Moldovanu example:
    two agents, one object, independent uniform binary two-dimensional
    types, own-value gap a>0 and external-value gap b>a. Every randomized
    epsilon-BIC mechanism with ex-ante welfare loss D satisfies
    (b-a)*epsilon+2*a*D >= a*(b-a)/8. Explicit ex-post budget-balanced
    mechanisms attain every frontier point. For nonnegative error and loss
    budgets this inequality exactly characterizes feasibility. Exact BIC
    has minimum expected welfare loss (b-a)/16. A reusable balanced-flow
    certificate theorem covers arbitrary finite own types, opposing states,
    outcomes, payoff tables and lotteries when its explicit pointwise
    certificate hypothesis holds. The old fixed deterministic example is
    retained as a corollary. This is not the original paper's continuous
    generic congruence theorem; no mathematical novelty claim is made.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  license: "BSD-3-Clause"
repository:
  role: "substantive-development"
classification:
  arxiv: ["cs.GT", "econ.TH"]
  msc2020: ["91B26"]
sources:
  - title: "Efficient Design with Interdependent Valuations"
    authors: ["Philippe Jehiel", "Benny Moldovanu"]
    type: "paper"
    year: 2001
    url: "https://doi.org/10.1111/1468-0262.00240"
    relationship: "adapts"
    note: >-
      The finite model is the binary analogue of Example 4.2 in the
      author-hosted February 20, 2000 draft. The quantitative error/loss
      bound and attaining transfers are derived here. The continuous
      congruence theorem 4.3, differentiability and genericity are not
      formalized. Cycle necessity and linear certificates are established
      background; no priority or original-author endorsement is claimed.
    author_endorsement: "not-contacted"
