name: Authorized exact-SHA Palomar full preflight
run-name: Full preflight for ${{ github.sha }}

# Dispatch-only exact-commit gate; publication/merge authorization is recorded separately.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jm-full-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: jmcont000001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
